name: 🎯 YouTube Downloader

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '🔄 Download Mode'
        required: true
        type: choice
        options:
          - single
          - playlist
          - channel
          - search
          - trim
          - trim-batch
        default: 'single'
      url:
        description: '🎬 URL or Search Query or channel name (@ChannelName or ChannelName)'
        required: true
        type: string
      type:
        description: '📦 Output Type'
        required: true
        type: choice
        options:
          - video
          - audio
        default: 'video'
      quality:
        description: 'Quality (video: 144/360/480/720/1080 | audio: 128/192/320)'
        required: false
        type: string
        default: '720'
      trim_start:
        description: '✂️ Trim Start Time (only for trim mode - e.g., 00:01:30 or 90)'
        required: false
        type: string
        default: ''
      trim_end:
        description: '✂️ Trim End Time (only for trim mode - e.g., 00:03:45 or 225)'
        required: false
        type: string
        default: ''
      trim_segments:
        description: '📋 Batch Trim Segments (for trim-batch mode) - Format: start1-end1,start2-end2 (e.g., 00:01:30-00:03:45,00:05:00-00:07:30,90-180)'
        required: false
        type: string
        default: ''
      max_videos:
        description: '🔢 Max results'
        required: false
        type: number
        default: 10
      split_threshold_mb:
        description: '📦 Split > MB (0=no)'
        required: false
        type: number
        default: 50

env:
  PYTHONUNBUFFERED: '1'
  DEBIAN_FRONTEND: 'noninteractive'

jobs:
  download-and-process:
    name: 🚀 YouTube Downloader
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}

      - name: ⚡ Setup
        run: |
          python3 -c "import requests" 2>/dev/null || pip3 install -q requests
          command -v yt-dlp &>/dev/null || pip3 install -q yt-dlp
          # Ensure latest yt-dlp
          pip3 install -U -q yt-dlp
          command -v zip &>/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq zip)
          command -v ffmpeg &>/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: 🔗 Prepare
        id: prep
        run: |
          M="${{ github.event.inputs.mode }}"
          U="${{ github.event.inputs.url }}"
          if [[ "$M" == "channel" && "$U" != http* ]]; then
            U="https://www.youtube.com/$([[ "$U" == @* ]] && echo "$U" || echo "@$U")"
          fi
          echo "URL=$U" >> $GITHUB_OUTPUT
          echo "MODE=$M" >> $GITHUB_OUTPUT

      - name: 🎯 Download & Process
        id: main
        env:
          MODE: ${{ steps.prep.outputs.MODE }}
          URL: ${{ steps.prep.outputs.URL }}
          TYPE: ${{ github.event.inputs.type }}
          QUALITY: ${{ github.event.inputs.quality }}
          TRIM_START: ${{ github.event.inputs.trim_start }}
          TRIM_END: ${{ github.event.inputs.trim_end }}
          TRIM_SEGMENTS: ${{ github.event.inputs.trim_segments }}
          MAX: ${{ github.event.inputs.max_videos }}
          SPLIT: ${{ github.event.inputs.split_threshold_mb }}
        run: |
          python3 << 'PYEOF'
          import os, json, time, re, subprocess, sys, hashlib, shutil
          from pathlib import Path
          from datetime import datetime

          M = os.environ['MODE']
          U = os.environ['URL']
          T = os.environ['TYPE']
          Q = os.environ.get('QUALITY', '720')
          MX = int(os.environ.get('MAX', '10'))
          SP = int(os.environ.get('SPLIT', '50'))
          TRIM_START = os.environ.get('TRIM_START', '').strip()
          TRIM_END = os.environ.get('TRIM_END', '').strip()
          TRIM_SEGMENTS = os.environ.get('TRIM_SEGMENTS', '').strip()

          def time_to_seconds(time_str):
              """Convert time string (HH:MM:SS, MM:SS, or seconds) to seconds"""
              if not time_str:
                  return None
              time_str = time_str.strip()
              try:
                  return int(time_str)
              except ValueError:
                  pass
              parts = time_str.split(':')
              if len(parts) == 3:  # HH:MM:SS
                  return int(parts[0]) * 3600 + int(parts[1]) * 60 + int(parts[2])
              elif len(parts) == 2:  # MM:SS
                  return int(parts[0]) * 60 + int(parts[1])
              else:
                  raise ValueError(f"Invalid time format: {time_str}")

          def parse_trim_segments(segments_str):
              """Parse trim segments from string format: 'start1-end1,start2-end2'"""
              segments = []
              if not segments_str:
                  return segments
              for segment in segments_str.split(','):
                  segment = segment.strip()
                  if '-' in segment:
                      parts = segment.split('-')
                      if len(parts) == 2:
                          start_str = parts[0].strip()
                          end_str = parts[1].strip()
                          try:
                              start_sec = time_to_seconds(start_str) if start_str else None
                              end_sec = time_to_seconds(end_str) if end_str else None
                              if start_sec is not None and end_sec is not None:
                                  if start_sec < end_sec:
                                      segments.append((start_sec, end_sec))
                                  else:
                                      print(f'   ⚠️ Invalid segment: {segment} (start >= end)')
                              else:
                                  print(f'   ⚠️ Invalid segment: {segment}')
                          except ValueError as e:
                              print(f'   ⚠️ Invalid time format in segment: {segment} - {e}')
                  else:
                      print(f'   ⚠️ Invalid segment format: {segment} (expected start-end)')
              return segments

          def trim_video(input_path, output_path, start_time, end_time):
              """Trim video using ffmpeg. Returns True on success."""
              if start_time is None and end_time is None:
                  return True
              cmd = ['ffmpeg', '-hide_banner', '-loglevel', 'error', '-i', str(input_path)]
              if start_time is not None:
                  cmd.extend(['-ss', str(start_time)])
              if end_time is not None:
                  duration = end_time - (start_time or 0)
                  cmd.extend(['-t', str(duration)])
              if T == 'audio':
                  cmd.extend(['-c:a', 'libmp3lame', '-b:a', f'{Q}k'])
              else:
                  # re-encode for accurate cuts
                  cmd.extend(['-c:v', 'libx264', '-c:a', 'aac', '-preset', 'fast', '-movflags', '+faststart'])
              cmd.extend(['-y', str(output_path)])
              try:
                  print(f'   ✂️ Trimming...')
                  if start_time is not None:
                      print(f'      Start: {start_time}s')
                  if end_time is not None:
                      print(f'      End: {end_time}s  (duration: {end_time - (start_time or 0)}s)')
                  result = subprocess.run(cmd, capture_output=True, text=True, timeout=600)
                  if result.returncode == 0 and output_path.exists() and output_path.stat().st_size > 0:
                      print(f'   ✅ Trimmed successfully → {output_path.name}')
                      return True
                  else:
                      err = (result.stderr or result.stdout or '')[:300]
                      print(f'   ⚠️ FFmpeg error: {err}')
                      return False
              except Exception as e:
                  print(f'   ❌ Trimming failed: {e}')
                  return False

          def get_video_title(video_url):
              """Get YouTube video title using yt-dlp"""
              try:
                  cmd = ['yt-dlp', '--get-title', '--no-warnings', '--no-check-certificates', video_url]
                  result = subprocess.run(cmd, capture_output=True, text=True, timeout=20)
                  if result.returncode == 0 and result.stdout.strip():
                      title = result.stdout.strip()
                      title = re.sub(r'[<>:"/\\|?*]', '_', title)
                      title = re.sub(r'\s+', ' ', title).strip()
                      return title
              except Exception as e:
                  print(f'   ⚠️ Could not get title: {e}')
              return None

          def safe_name(text, maxlen=40):
              safe = re.sub(r'[^\w]', '_', text)[:maxlen]
              safe = re.sub(r'_+', '_', safe).strip('_')
              if not safe:
                  safe = hashlib.md5(text.encode()).hexdigest()[:8]
              return safe

          def fm(n):
              if not n: return 'N/A'
              try:
                  n = int(n)
                  return f'{n/1e6:.1f}M' if n >= 1e6 else f'{n/1e3:.1f}K' if n >= 1e3 else str(n)
              except: return str(n)

          def gv(vid):
              """Get video info AND channel name from actual video data"""
              try:
                  r = subprocess.run(
                      ['yt-dlp', '--dump-json', '--no-warnings', '--no-check-certificates',
                       f'https://youtube.com/watch?v={vid}'],
                      capture_output=True, text=True, timeout=20
                  )
                  if r.returncode == 0 and r.stdout.strip():
                      d = json.loads(r.stdout)
                      channel = (d.get('channel') or d.get('uploader') or
                                d.get('uploader_id') or d.get('creator') or 'Unknown')
                      views = d.get('view_count')
                      duration = d.get('duration', 0)
                      channel_url = d.get('channel_url', '') or d.get('uploader_url', '')
                      handle = None
                      if channel_url:
                          m = re.search(r'@([\w-]+)', channel_url)
                          if m: handle = m.group(1)
                      if not handle:
                          handle = safe_name(channel, 30) if channel and channel != 'Unknown' else None
                      return (channel.strip() if channel else 'Unknown', views, int(duration) if duration else 0, handle)
              except: pass
              return ('Unknown', None, 0, None)

          def get_channel_from_url(url):
              m = re.search(r'@([\w-]+)', url)
              if m: return m.group(1)
              m = re.search(r'channel/([\w-]+)', url)
              if m: return m.group(1)
              m = re.search(r'c/([\w-]+)', url)
              if m: return m.group(1)
              m = re.search(r'user/([\w-]+)', url)
              if m: return m.group(1)
              return None

          def get_channel_from_playlist(playlist_url):
              try:
                  cmd = ['yt-dlp', '--flat-playlist', '--dump-json', '--playlist-end', '1',
                         '--no-warnings', '--no-check-certificates', playlist_url]
                  r = subprocess.run(cmd, capture_output=True, text=True, timeout=20)
                  if r.returncode == 0 and r.stdout.strip():
                      d = json.loads(r.stdout.strip().split('\n')[0])
                      vid = d.get('id', '')
                      if vid:
                          _, _, _, handle = gv(vid)
                          if handle: return handle
                      ch = d.get('channel') or d.get('uploader') or d.get('uploader_id')
                      if ch: return safe_name(ch, 30)
              except: pass
              return None

          def gvl(u, n):
              """Get video list - returns (videos, channel_folder_name)"""
              channel_folder = get_channel_from_url(u)
              if not channel_folder and 'playlist' in u:
                  print(f'   🔍 Detecting channel from playlist...')
                  channel_folder = get_channel_from_playlist(u)
              if not channel_folder:
                  channel_folder = 'playlist_videos'
              print(f'   📁 Folder: {channel_folder}_videos')
              c = ['yt-dlp', '--flat-playlist', '--dump-json', '--no-warnings', '--no-check-certificates']
              if n > 0: c.extend(['--playlist-end', str(n)])
              c.append(u)
              r = subprocess.run(c, capture_output=True, text=True, timeout=60)
              v = []
              for line in r.stdout.strip().split('\n'):
                  if line and len(v) < n:
                      try:
                          d = json.loads(line)
                          vid = d.get('id', '')
                          if not vid: continue
                          title = d.get('title', 'Untitled')[:60]
                          print(f'   📊 [{len(v)+1}/{n}] {title}...')
                          ch, vw, dr, _ = gv(vid)
                          if not ch or ch == 'Unknown':
                              ch = (d.get('channel') or d.get('uploader') or
                                    d.get('uploader_id') or d.get('creator') or 'Unknown')
                          if not vw: vw = d.get('view_count')
                          if not dr: dr = d.get('duration', 0)
                          v.append({
                              'id': vid, 't': title,
                              'u': f'https://youtube.com/watch?v={vid}',
                              'dr': int(dr) if dr else 0,
                              'th': f'https://i.ytimg.com/vi/{vid}/maxresdefault.jpg',
                              'c': str(ch).strip() if ch else 'Unknown',
                              'v': fm(vw)
                          })
                      except Exception as e:
                          print(f'      ⚠️ Skip: {str(e)[:40]}')
                          continue
              return v, channel_folder

          def mkidx(v, cn, cd):
              ts = datetime.now().strftime('%Y-%m-%d_%H-%M-%S')
              Path('./playlists').mkdir(exist_ok=True)
              inf = cd / 'info'
              inf.mkdir(parents=True, exist_ok=True)
              idxf = f'playlists/{cn}_{ts}.md'
              m = (f'# 📺 {cn}\n\n**{datetime.now():%Y-%m-%d %H:%M}** | **{len(v)} videos**\n\n'
                   f'| # | Thumbnail | Title | Duration | Views |\n'
                   f'|---|-----------|-------|----------|-------|\n')
              for i, x in enumerate(v, 1):
                  dur_str = f'{x["dr"]//60}:{x["dr"]%60:02d}' if x['dr'] else '?'
                  m += f'| {i} | [<img src="{x["th"]}" width="80">]({x["u"]}) | [{x["t"]}]({x["u"]}) | {dur_str} | {x["v"]} |\n'
              m += '\n---\n\n## 📝 Details\n\n'
              for i, x in enumerate(v, 1):
                  sn = f'v{i:03d}_{x["id"]}'
                  dur_str = f'{x["dr"]//60} minutes' if x['dr'] else 'Unknown'
                  info_md = (f'# 🎬 {x["t"]}\n\n'
                            f'![Thumbnail]({x["th"]})\n\n'
                            f'## Info\n\n'
                            f'| Property | Value |\n|----------|-------|\n'
                            f'| **Channel** | {x["c"]} |\n'
                            f'| **Duration** | {dur_str} |\n'
                            f'| **Views** | {x["v"]} |\n'
                            f'| **Video ID** | `{x["id"]}` |\n'
                            f'| **URL** | {x["u"]} |\n\n'
                            f'## Thumbnail\n\n'
                            f'<img src="{x["th"]}" width="640">\n\n'
                            f'---\n*Downloaded: {datetime.now():%Y-%m-%d %H:%M}*')
                  (inf / f'{sn}.md').write_text(info_md)
                  m += (f'### {i}. {x["t"]}\n\n'
                       f'![Thumbnail]({x["th"]})\n\n'
                       f'- **{dur_str}** | **{x["v"]}** views | **{x["c"]}**\n'
                       f'- 📄 [info/{sn}.md](info/{sn}.md)\n\n---\n\n')
              Path(idxf).write_text(m)
              print(f'📄 Index: {idxf}')
              return idxf

          def build_ydl_opts(outtmpl, is_audio=False, quality='720'):
              """Build yt-dlp options for download."""
              opts = {
                  'outtmpl': outtmpl,
                  'no_warnings': True,
                  'nocheckcertificate': True,
                  'quiet': False,
                  'noplaylist': True,
              }
              if is_audio:
                  opts['format'] = 'bestaudio/best'
                  opts['postprocessors'] = [{
                      'key': 'FFmpegExtractAudio',
                      'preferredcodec': 'mp3',
                      'preferredquality': quality,
                  }]
              else:
                  # Prefer mp4 container, best video <= quality + best audio
                  q = quality if quality.isdigit() else '720'
                  opts['format'] = f'bestvideo[height<={q}][ext=mp4]+bestaudio[ext=m4a]/bestvideo[height<={q}]+bestaudio/best[height<={q}]/best'
                  opts['merge_output_format'] = 'mp4'
              return opts

          def dl_with_ytdlp(url, output_path, is_audio=False, quality='720'):
              """
              Download with yt-dlp directly.
              Returns the final Path of the downloaded file, or None on failure.
              """
              output_path = Path(output_path)
              output_path.parent.mkdir(parents=True, exist_ok=True)

              # Use a temporary template so we can detect the real extension
              tmp_template = str(output_path.with_suffix('')) + '.%(ext)s'

              cmd = [
                  'yt-dlp',
                  '--no-warnings',
                  '--no-check-certificates',
                  '-o', tmp_template,
              ]

              if is_audio:
                  cmd.extend([
                      '-x', '--audio-format', 'mp3',
                      '--audio-quality', f'{quality}k',
                      '-f', 'bestaudio/best',
                  ])
              else:
                  q = quality if str(quality).isdigit() else '720'
                  # Prefer progressive mp4 when possible, otherwise merge
                  fmt = (
                      f'bestvideo[height<={q}][ext=mp4]+bestaudio[ext=m4a]/'
                      f'bestvideo[height<={q}]+bestaudio/'
                      f'best[height<={q}]/best'
                  )
                  cmd.extend(['-f', fmt, '--merge-output-format', 'mp4'])

              cmd.append(url)

              print(f'   ⬇️ Downloading with yt-dlp...')
              try:
                  result = subprocess.run(cmd, capture_output=True, text=True, timeout=900)
                  if result.returncode != 0:
                      print(f'   ⚠️ yt-dlp stderr: {(result.stderr or "")[:400]}')
                      # Still try to find any produced file
              except subprocess.TimeoutExpired:
                  print('   ❌ Download timed out')
                  return None
              except Exception as e:
                  print(f'   ❌ Download error: {e}')
                  return None

              # Find the produced file
              parent = output_path.parent
              stem = output_path.stem
              candidates = list(parent.glob(f'{stem}.*'))
              # Prefer mp4 / mp3
              preferred = None
              for ext in ('.mp4', '.mp3', '.mkv', '.webm', '.m4a'):
                  for c in candidates:
                      if c.suffix.lower() == ext and c.stat().st_size > 0:
                          preferred = c
                          break
                  if preferred:
                      break
              if not preferred and candidates:
                  preferred = max(candidates, key=lambda p: p.stat().st_size)

              if preferred and preferred.exists() and preferred.stat().st_size > 0:
                  # Rename to the requested name if needed
                  final = output_path if output_path.suffix else preferred
                  if preferred != final:
                      if final.exists():
                          final.unlink()
                      preferred.rename(final)
                      preferred = final
                  print(f'   ✅ Downloaded ({preferred.stat().st_size / 1e6:.1f} MB) → {preferred.name}')
                  return preferred
              else:
                  print('   ❌ No output file produced by yt-dlp')
                  if result.stdout:
                      print(f'   stdout: {result.stdout[:300]}')
                  return None

          def split_file(filepath, threshold_mb):
              size_mb = filepath.stat().st_size / 1e6
              if threshold_mb > 0 and size_mb > threshold_mb:
                  print(f'   ✂️ Splitting ({size_mb:.0f}MB) into {threshold_mb}MB parts...')
                  parent = filepath.parent
                  name = filepath.name
                  subprocess.run(['zip', '-r', '-q', '-s', f'{threshold_mb}m', f'{name}.zip', name], cwd=parent, check=True)
                  filepath.unlink()
                  parts = sorted(parent.glob(f'{name}.z*'))
                  print(f'   ✅ Split into {len(parts)} parts')
                  return True
              return False

          # ---------- Parse trim times ----------
          if M == 'trim':
              try:
                  start_sec = time_to_seconds(TRIM_START) if TRIM_START else None
                  end_sec = time_to_seconds(TRIM_END) if TRIM_END else None
                  if not TRIM_START and not TRIM_END:
                      print('❌ Trim mode requires at least start or end time')
                      sys.exit(1)
                  if start_sec is not None and start_sec < 0:
                      print('❌ Start time cannot be negative')
                      sys.exit(1)
                  if end_sec is not None and end_sec < 0:
                      print('❌ End time cannot be negative')
                      sys.exit(1)
                  if start_sec is not None and end_sec is not None and start_sec >= end_sec:
                      print('❌ Start time must be less than end time')
                      sys.exit(1)
                  print(f'✂️ TRIM MODE ENABLED')
                  print(f'   Start: {TRIM_START or "0"} → {start_sec or 0}s')
                  print(f'   End: {TRIM_END or "end"} → {end_sec or "end"}s')
              except ValueError as e:
                  print(f'❌ Invalid time format: {e}')
                  sys.exit(1)

          if M == 'trim-batch':
              segments = parse_trim_segments(TRIM_SEGMENTS)
              if not segments:
                  print('❌ No valid trim segments provided for batch trim mode')
                  print('   Format example: 00:01:30-00:03:45,00:05:00-00:07:30,90-180')
                  sys.exit(1)
              print(f'📋 BATCH TRIM MODE ENABLED')
              print(f'   {len(segments)} segments to process:')
              for i, (start, end) in enumerate(segments, 1):
                  print(f'      Segment {i}: {start}s → {end}s (duration: {end-start}s)')

          print(f'{"="*50}')
          print(f'🎬 {M.upper()} MODE')
          print(f'{"="*50}')

          is_audio = (T == 'audio')
          ext = 'mp3' if is_audio else 'mp4'

          # ==================== SEARCH ====================
          if M == 'search':
              v, _ = gvl(f'ytsearch{MX}:{U}', MX)
              if not v:
                  print('❌ No results')
                  sys.exit(1)
              ts = datetime.now().strftime('%Y-%m-%d_%H-%M-%S')
              Path('./searches').mkdir(exist_ok=True)
              qs = safe_name(U, 30)
              f = f'searches/{qs}_{ts}.md'
              m = (f'# 🔍 Search: {U}\n\n**{datetime.now():%Y-%m-%d %H:%M}** | **{len(v)} results**\n\n'
                   f'| # | Thumbnail | Title | Channel | Views | Duration |\n'
                   f'|---|-----------|-------|---------|-------|----------|\n')
              for i, x in enumerate(v, 1):
                  m += f'| {i} | [<img src="{x["th"]}" width="80">]({x["u"]}) | [{x["t"]}]({x["u"]}) | {x["c"][:20]} | {x["v"]} | {x["dr"]//60}m |\n'
              m += '\n---\n\n'
              for i, x in enumerate(v, 1):
                  m += (f'### {i}. {x["t"]}\n\n<img src="{x["th"]}" width="640">\n\n'
                       f'| Property | Value |\n|----------|-------|\n'
                       f'| Channel | {x["c"]} |\n| Duration | {x["dr"]//60}m |\n'
                       f'| Views | {x["v"]} |\n| ID | `{x["id"]}` |\n| URL | {x["u"]} |\n\n---\n\n')
              Path(f).write_text(m)
              Path('/tmp/meta.json').write_text(json.dumps({'m': 'search', 'ok': 0}))
              print(f'✅ {f}')

          # ==================== TRIM-BATCH ====================
          elif M == 'trim-batch':
              print(f'\n📦 Processing batch trim request...')
              vid_match = re.search(r'(?:v=|/)([\w-]{11})', U)
              if not vid_match:
                  print('❌ Invalid YouTube URL')
                  sys.exit(1)
              vid = vid_match.group(1)

              print(f'   Fetching video title...')
              video_title = get_video_title(U)
              if not video_title:
                  video_title = f'video_{vid}'
              else:
                  video_title = re.sub(r'[<>:"/\\|?*]', '_', video_title)
                  video_title = re.sub(r'\s+', ' ', video_title).strip()

              ch, views, duration, handle = gv(vid)
              cn = handle if handle else get_channel_from_url(U) or safe_name(ch, 30) or 'video'

              print(f'   Video: {video_title}')
              print(f'   Video ID: {vid}')
              print(f'   Duration: {duration//60}:{duration%60:02d}')
              print(f'   Channel: {ch}')
              print(f'   Segments to extract: {len(segments)}')

              cd = Path(f'downloads/{cn}_videos')
              cd.mkdir(parents=True, exist_ok=True)
              batch_folder = cd / f'{safe_name(video_title, 50)}_clips'
              batch_folder.mkdir(parents=True, exist_ok=True)

              # Download the FULL video once
              temp_fp = batch_folder / f'{vid}_full_temp.{ext}'
              downloaded = dl_with_ytdlp(U, temp_fp, is_audio=is_audio, quality=Q)

              if not downloaded:
                  print('❌ Failed to download video')
                  sys.exit(1)

              print(f'   📁 Processing {len(segments)} trim segments...\n')
              successful = 0
              for i, (start_sec, end_sec) in enumerate(segments, 1):
                  print(f'   📍 Segment {i}/{len(segments)}: {start_sec}s → {end_sec}s (duration: {end_sec-start_sec}s)')
                  start_str = f"{start_sec//3600:02d}-{(start_sec%3600)//60:02d}-{start_sec%60:02d}"
                  end_str = f"{end_sec//3600:02d}-{(end_sec%3600)//60:02d}-{end_sec%60:02d}"
                  if len(segments) > 1:
                      segment_filename = f"{safe_name(video_title, 40)}_clip_{i:02d}_{start_str}_to_{end_str}_trimmed.{ext}"
                  else:
                      segment_filename = f"{safe_name(video_title, 40)}_{start_str}_to_{end_str}_trimmed.{ext}"
                  final_fp = batch_folder / segment_filename

                  if trim_video(downloaded, final_fp, start_sec, end_sec):
                      split_file(final_fp, SP)
                      successful += 1
                  else:
                      print(f'   ❌ Segment {i} failed')
                  print()

              # Clean up temporary full file
              try:
                  if downloaded.exists():
                      downloaded.unlink()
              except: pass

              print(f'   {"="*40}')
              print(f'   ✅ Batch trim complete: {successful}/{len(segments)} segments saved')
              print(f'   📁 Location: {batch_folder}/')
              print(f'   {"="*40}')
              if successful == 0:
                  sys.exit(1)

          # ==================== TRIM (single) ====================
          elif M == 'trim':
              print(f'\n✂️ Processing trim request...')
              vid_match = re.search(r'(?:v=|/)([\w-]{11})', U)
              if not vid_match:
                  print('❌ Invalid YouTube URL')
                  sys.exit(1)
              vid = vid_match.group(1)

              ch, views, duration, handle = gv(vid)
              cn = handle if handle else get_channel_from_url(U) or safe_name(ch, 30) or 'video'

              print(f'   Video: {vid}')
              print(f'   Duration: {duration//60}:{duration%60:02d}')
              print(f'   Channel: {ch}')

              cd = Path(f'downloads/{cn}_videos')
              cd.mkdir(parents=True, exist_ok=True)

              trim_suffix = ""
              if TRIM_START:
                  trim_suffix += f"_from_{TRIM_START.replace(':', '-')}"
              if TRIM_END:
                  trim_suffix += f"_to_{TRIM_END.replace(':', '-')}"

              temp_fp = cd / f'v_{vid}_temp.{ext}'
              final_fp = cd / f'v_{vid}{trim_suffix}_trimmed.{ext}'

              downloaded = dl_with_ytdlp(U, temp_fp, is_audio=is_audio, quality=Q)
              if not downloaded:
                  print('❌ Failed to download video')
                  sys.exit(1)

              if trim_video(downloaded, final_fp, start_sec, end_sec):
                  try:
                      if downloaded.exists() and downloaded != final_fp:
                          downloaded.unlink()
                  except: pass
                  print(f'   ✅ Trimmed video saved: {final_fp.name}')
                  print(f'   📁 Location: {cd}/')
                  split_file(final_fp, SP)
              else:
                  print('   ❌ Trimming failed')
                  sys.exit(1)

          # ==================== PLAYLIST / CHANNEL ====================
          elif M in ('playlist', 'channel'):
              print(f'\n📋 Extracting videos...')
              v, cn = gvl(U, MX)
              if not v:
                  print('❌ No videos found')
                  sys.exit(1)

              cd = Path(f'downloads/{cn}_videos')
              cd.mkdir(parents=True, exist_ok=True)

              print(f'\n📝 Creating index...')
              mkidx(v, cn, cd)

              ok, fl = [], []
              print(f'\n📥 Downloading {len(v)} videos...\n{"="*50}')

              for i, x in enumerate(v, 1):
                  print(f'\n📥 [{i}/{len(v)}] {x["t"]}')
                  print(f'   Channel: {x["c"]} | Duration: {x["dr"]//60}m | Views: {x["v"]}')

                  fp = cd / f'v{i:03d}_{x["id"]}.{ext}'
                  downloaded = dl_with_ytdlp(x['u'], fp, is_audio=is_audio, quality=Q)
                  if downloaded:
                      split_file(downloaded, SP)
                      ok.append(x['t'])
                  else:
                      print(f'   ❌ Download failed')
                      fl.append(x['t'])

                  if i < len(v):
                      print(f'   ⏳ Waiting...')
                      time.sleep(1)

              Path('/tmp/meta.json').write_text(json.dumps({
                  'm': M, 'cd': str(cd), 'ok': len(ok), 'fl': len(fl), 'total': len(v)
              }))
              print(f'\n{"="*50}')
              print(f'📊 {len(ok)}/{len(v)} downloaded successfully')
              if fl: print(f'❌ Failed: {fl}')
              print(f'{"="*50}')

          # ==================== SINGLE ====================
          else:
              vid_match = re.search(r'(?:v=|/)([\w-]{11})', U)
              vid = vid_match.group(1) if vid_match else 'x'

              ch, _, _, handle = gv(vid)
              cn = handle if handle else get_channel_from_url(U) or safe_name(ch, 30) or 'video'

              cd = Path(f'downloads/{cn}_videos')
              cd.mkdir(parents=True, exist_ok=True)
              fp = cd / f'v_{vid}.{ext}'

              downloaded = dl_with_ytdlp(U, fp, is_audio=is_audio, quality=Q)
              if downloaded:
                  print(f'✅ Saved to {cn}_videos/ ({downloaded.stat().st_size / 1e6:.1f}MB)')
                  split_file(downloaded, SP)
              else:
                  print('❌ Failed')
                  sys.exit(1)

          PYEOF

      - name: 📤 Push Files
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📤 PUSHING TO GITHUB"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          git config user.name "github-actions[bot]"
          git config user.email "bot@github.com"
          
          echo ""
          echo "📋 Adding all files..."
          git add -A
          
          TOTAL=$(git diff --cached --name-only | wc -l)
          echo "   Found $TOTAL files"
          
          if [ "$TOTAL" -eq 0 ]; then
            echo "❌ Nothing to push"
            exit 0
          fi
          
          git diff --cached --name-only | while read f; do
            echo "   📎 $f"
          done
          
          echo ""
          echo "📤 Pushing..."
          
          git commit -m "📦 $(date +%m%d-%H%M) [skip ci]" --quiet
          
          for i in 1 2 3 4 5; do
            echo -n "   🚀 Attempt $i/5..."
            if git pull --rebase --quiet 2>/dev/null && git push --quiet 2>/dev/null; then
              echo " ✅ DONE!"
              exit 0
            fi
            echo " ❌"
            git rebase --abort 2>/dev/null
            [ $i -lt 5 ] && sleep $((i*5))
          done
          
          echo "   ❌ Push failed"
          exit 1
